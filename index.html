    <script>
      // React 실행 전에 테마를 적용해 다크 모드 깜빡임 방지
      try {
        var t = (JSON.parse(localStorage.getItem("kda05:state:v1") || "{}").theme) || "system";
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
